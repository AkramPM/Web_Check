name: Check Website Status

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    steps:
      - name: Test URLs
        run: |
          WEBSITES=(
            "https://google.com"
            "https://github.com"
            "https://gfgggb.com"
          )

          FAILED=0

          for url in "${WEBSITES[@]}"; do
            echo "Checking: $url"
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 "$url")
            
            # Use double brackets and standard wildcard matching to catch any 50x code
            if [[ "$STATUS" == 50* ]]; then
              echo "❌ FAILED ($STATUS)"
              FAILED=1
            else
              echo "✅ Pass ($STATUS)"
            fi
            echo "-----------------------------------"
          done

          if [ $FAILED -ne 0 ]; then
            echo "One or more websites returned a 50x server error!"
            exit 1
          fi
