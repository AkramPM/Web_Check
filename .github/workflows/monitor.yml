name: Check Website Status
#

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    steps:
      - name: Test URLs
        run: |
          WEBSITES=(
            "https://google.com"
            "https://github.com"
            "https://gfgggb.com"
            "https://github.com"
          )

                   FAILED=0

          for url in "${WEBSITES[@]}"; do
            echo "Checking: $url"
            
            # Use '|| true' to prevent curl connection errors from crashing the script execution
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 "$url" || echo "000")
            
            # A status code of 000 means the server couldn't be reached at all (DNS down / connection timeout)
            if [[ "$STATUS" == 50* ]] || [ "$STATUS" == "000" ]; then
              echo "❌ FAILED ($STATUS)"
              FAILED=1
            else
              echo "✅ Pass ($STATUS)"
            fi
            echo "-----------------------------------"
          done

          # The loop finishes everything before evaluating final completion rules
          if [ $FAILED -ne 0 ]; then
            echo "One or more websites returned a 50x server error or connection failure!"
            exit 1
          fi

            # This step only triggers if the 'Test URLs' step fails
      - name: Send custom failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ ALERT: Website Status Check Failed"
          to: akram.mohamed@raqmia.net
          from: Website Monitor Bot
          body: "One or more of your 15 monitored websites failed the HTTP status check. Please check your GitHub Actions logs immediately."
