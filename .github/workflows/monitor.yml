name: Check Website Status
#

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    steps:
      - name: Test URLs
        run: |
          WEBSITES=(
            "https://google.com"
            "https://github.com"
            "https://gfgggb.com"
            "https://github.com"
            "https://gfgggccb.com"
          )

          FAILED=0
          FAILED_LIST=""

          for url in "${WEBSITES[@]}"; do
            echo "Checking: $url"
            
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 "$url" || echo 0)
            STATUS=$(echo "$STATUS" | tr -d -c '0-9')
            if [ -z "$STATUS" ]; then STATUS=0; fi

            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
              echo "❌ FAILED ($STATUS)"
              FAILED=1
              # Append the failed URL and its status code to our list
              FAILED_LIST="$FAILED_LIST\\n- $url (Status: $STATUS)"
            else
              echo "✅ Pass ($STATUS)"
            fi
            echo "-----------------------------------"
          done

          # Save the list of broken websites to a GitHub environment file so the email step can read it
          echo "FAILED_WEBSITES<<EOF" >> $GITHUB_ENV
          echo -e "$FAILED_LIST" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ $FAILED -ne 0 ]; then
            echo "One or more websites returned a 50x server error or connection failure!"
            exit 1
          fi

            # This step only triggers if the 'Test URLs' step fails
      - name: Send custom failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ ALERT: Website Status Check Failed"
          to: akram.mohamed@raqmia.net
          from: Website Monitor Bot
          body: |
            The scheduled uptime check detected that the following website(s) are down or throwing errors:
            ${{ env.FAILED_WEBSITES }}
