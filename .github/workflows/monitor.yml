name: Check Website Status
#

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    steps:
      - name: Test URLs
        run: |
          WEBSITES=(
            "https://google.com"
            "https://github.com"
            "https://gfgggb.com"
            "https://github.com"
            "https://gfgggccb.com"
          )

          FAILED=0

          for url in "${WEBSITES[@]}"; do
            echo "Checking: $url"
            
            # Fetch the status numeric value safely, defaulting to 0 if the website fails to connect
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 "$url" || echo 0)
            
            # Clean up any unexpected whitespace or extra digits from curl output
            STATUS=$(echo "$STATUS" | tr -d -c '0-9')
            
            # Fallback if the variable ends up entirely empty
            if [ -z "$STATUS" ]; then STATUS=0; fi

            echo "Extracted status code: $STATUS"

            # Fail if status is 0 (connection error) OR 500 and above (server errors)
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
              echo "❌ FAILED ($STATUS)"
              FAILED=1
            else
              echo "✅ Pass ($STATUS)"
            fi
            echo "-----------------------------------"
          done

          # Trigger step failure after checking every site on the list
          if [ $FAILED -ne 0 ]; then
            echo "One or more websites returned a 50x server error or connection failure!"
            exit 1
          fi

            # This step only triggers if the 'Test URLs' step fails
      - name: Send custom failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ ALERT: Website Status Check Failed"
          to: akram.mohamed@raqmia.net
          from: Website Monitor Bot
          body: "One or more of your 15 monitored websites failed the HTTP status check. Please check your GitHub Actions logs immediately."
